# Jonathan: bathroom-before-bed reminder
#
# Between 7pm and 11pm, when the FP2 sees Jonathan get into bed and his toilet
# has not been flushed in the last 5 minutes, his HomePods tell him to go to the
# bathroom. The reminder repeats every 90 seconds until the toilet vibration
# sensor fires. At most 2 reminders are started per night.
#
# BEFORE USE, replace these three entity IDs with your own:
#   binary_sensor.jonathan_bed_presence   -> the FP2 bed-zone presence sensor
#   media_player.jonathans_homepod        -> his HomePod(s); add one line per speaker
#   tts.home_assistant_cloud              -> your text-to-speech entity
#
# INSTALL (YAML): keep this file in /config/packages/ and make sure
# configuration.yaml has:
#   homeassistant:
#     packages: !include_dir_named packages
#
# INSTALL (UI): create a Counter helper named "Jonathan bedtime bathroom alerts"
# (entity ID counter.jonathan_bedtime_bathroom_alerts), then create a new
# automation, choose "Edit in YAML", and paste everything from "alias:" down.

counter:
  jonathan_bedtime_bathroom_alerts:
    name: Jonathan bedtime bathroom alerts
    icon: mdi:toilet
    initial: 0
    step: 1

automation:
  - id: jonathan_bedtime_bathroom_reminder
    alias: "Jonathan: bathroom before bed reminder"
    description: >-
      Reminds Jonathan on his HomePods to use the bathroom when he gets into bed
      without having flushed in the last 5 minutes. Repeats every 90 seconds
      until he flushes. Limited to 2 reminders per night, 7pm-11pm.
    mode: single
    max_exceeded: silent

    triggers:
      - trigger: state
        id: in_bed
        entity_id: binary_sensor.jonathan_bed_presence
        from: "off"
        to: "on"
      # Start each night with a fresh allowance of reminders.
      - trigger: time
        id: new_night
        at: "19:00:00"

    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: new_night
            sequence:
              - action: counter.reset
                target:
                  entity_id: counter.jonathan_bedtime_bathroom_alerts

          - conditions:
              - condition: trigger
                id: in_bed
              - condition: time
                after: "19:00:00"
                before: "23:00:00"
              # No more than 2 reminders per night.
              - condition: numeric_state
                entity_id: counter.jonathan_bedtime_bathroom_alerts
                below: 2
              # No flush detected in the last 5 minutes.
              - condition: state
                entity_id: binary_sensor.kids_room_toilet_vibraion_sensor_vibration
                state: "off"
                for: "00:05:00"
            sequence:
              - variables:
                  alert_started: "{{ now().timestamp() }}"
              - action: counter.increment
                target:
                  entity_id: counter.jonathan_bedtime_bathroom_alerts
              - repeat:
                  sequence:
                    - action: tts.speak
                      continue_on_error: true
                      target:
                        entity_id: tts.home_assistant_cloud
                      data:
                        media_player_entity_id:
                          - media_player.jonathans_homepod
                        message: >-
                          Jonathan, please go to the bathroom before you go to bed.
                        cache: true
                    # Wait up to 90 seconds for a flush. Checking last_changed
                    # also catches a flush that happened while the HomePods
                    # were still speaking.
                    - wait_template: >-
                        {{ is_state('binary_sensor.kids_room_toilet_vibraion_sensor_vibration', 'on')
                           or as_timestamp(states.binary_sensor.kids_room_toilet_vibraion_sensor_vibration.last_changed)
                              > alert_started }}
                      timeout: "00:01:30"
                  until:
                    # Stop once he flushes. As a safety net (dead sensor
                    # battery, nobody home) give up after 30 minutes.
                    - condition: template
                      value_template: >-
                        {{ wait.completed
                           or now().timestamp() - alert_started > 1800 }}
